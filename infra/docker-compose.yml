version: '3.8'

services:
  backend:
    build: 
      context: ../be/spring
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    environment:
      - DB_URL=${DB_URL}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET}
      - AWS_S3_PHOTO_PATH=${AWS_S3_PHOTO_PATH}
      - AWS_REGION=${AWS_REGION}
      - AWS_ACCESS_KEY=${AWS_ACCESS_KEY}
      - AWS_SECRET_KEY=${AWS_SECRET_KEY}
      - AWS_S3_PRESIGNED_URL_EXP_MIN=${AWS_S3_PRESIGNED_URL_EXP_MIN}
    depends_on:
      - redis
      - rabbitmq
    networks:
      - app-network
    restart: always

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    networks:
      - app-network
    restart: always

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASS}
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - app-network
    restart: always

  # frontend:
  #   build:
  #     context: ../fe
  #     dockerfile: Dockerfile
  #   ports:
  #     - "80:80"
  #   depends_on:
  #     - backend
  #   networks:
  #     - app-network
  #   restart: always

  ai:
    build:
      context: ../ai
      dockerfile: Dockerfile
    volumes:
      - ../ai:/app
    ports:
      - "8000:8000"
    env_file:
      - ../ai/.env
    networks:
      - app-network
    restart: always

networks:
  app-network:
    driver: bridge

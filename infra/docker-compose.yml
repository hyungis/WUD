services:
  # 단일 진입점: frontend(nginx)만 80 포트 노출
  frontend:
    build:
      context: ../fe
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - app-network
    restart: always

  backend:
    platform: linux/amd64
    build:
      context: ../be/spring
      dockerfile: Dockerfile
    env_file:
      - ./.env
    environment:
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
    expose:
      - "8081"
    depends_on:
      - redis
      - rabbitmq
    networks:
      - app-network
    restart: always

  redis:
    image: redis:alpine
    networks:
      - app-network
    restart: always

  rabbitmq:
    image: rabbitmq:3-management-alpine
    env_file:
      - ./.env
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASS}
    ports:
      - "127.0.0.1:15672:15672"  # SSH 터널링용 (관리 UI)
    networks:
      - app-network
    restart: always

  ai:
    build:
      context: ../ai
      dockerfile: Dockerfile
    volumes:
      - ../ai:/app
    env_file:
      - ../ai/.env
    environment:
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=${RABBITMQ_USER}
      - RABBITMQ_PASS=${RABBITMQ_PASS}
      - DAILY_AI_USE_MOCK=false
      - AI_RABBITMQ_EXCHANGE=wud.deep.ai.exchange
      - AI_RABBITMQ_REQUEST_QUEUE=wud.deep.ai.request.queue
      - AI_RABBITMQ_ROUTING_KEY=wud.deep.ai.request.routing-key
      - AI_RABBITMQ_RESULT_EXCHANGE=wud.deep.ai.exchange
      - AI_RABBITMQ_RESULT_ROUTING_KEY=wud.deep.ai.result.routing-key
      - AI_DAILY_RABBITMQ_EXCHANGE=wud.daily.ai.exchange
      - AI_DAILY_RABBITMQ_REQUEST_QUEUE=wud.daily.ai.request.queue
      - AI_DAILY_RABBITMQ_ROUTING_KEY=wud.daily.ai.request.routing-key
      - AI_DAILY_RABBITMQ_RESULT_EXCHANGE=wud.daily.ai.exchange
      - AI_DAILY_RABBITMQ_RESULT_ROUTING_KEY=wud.daily.ai.result.routing-key
    depends_on:
      - rabbitmq
    networks:
      - app-network
    restart: always

networks:
  app-network:
    driver: bridge

services:
  # SSL 종료 + 리버스 프록시 (단일 진입점)
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/logs:/var/log/nginx
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    command: ["sh", "-c", "while :; do sleep 6h && nginx -s reload; done & nginx -g 'daemon off;'"]
    depends_on:
      - frontend
      - backend
    networks:
      - app-network
    restart: always

  frontend:
    build:
      context: ../fe
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    expose:
      - "80"
    depends_on:
      - backend
    networks:
      - app-network
    restart: always

  backend:
    platform: linux/amd64
    build:
      context: ../be/spring
      dockerfile: Dockerfile
    env_file:
      - ./.env
    environment:
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
    expose:
      - "8081"
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - app-network
    restart: always

  redis:
    image: redis:alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - app-network
    restart: always

  rabbitmq:
    image: rabbitmq:3-management-alpine
    env_file:
      - ./.env
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASS}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "127.0.0.1:15672:15672"
    networks:
      - app-network
    restart: always

  ai:
    build:
      context: ../ai
      dockerfile: Dockerfile
    volumes:
      - ../ai:/app
    env_file:
      - ../ai/.env
    environment:
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=${RABBITMQ_USER}
      - RABBITMQ_PASS=${RABBITMQ_PASS}
      - DAILY_AI_USE_MOCK=false
      - AI_RABBITMQ_EXCHANGE=wud.deep.ai.exchange
      - AI_RABBITMQ_REQUEST_QUEUE=wud.deep.ai.request.queue
      - AI_RABBITMQ_ROUTING_KEY=wud.deep.ai.request.routing-key
      - AI_RABBITMQ_RESULT_EXCHANGE=wud.deep.ai.exchange
      - AI_RABBITMQ_RESULT_ROUTING_KEY=wud.deep.ai.result.routing-key
      - AI_DAILY_RABBITMQ_EXCHANGE=wud.daily.ai.exchange
      - AI_DAILY_RABBITMQ_REQUEST_QUEUE=wud.daily.ai.request.queue
      - AI_DAILY_RABBITMQ_ROUTING_KEY=wud.daily.ai.request.routing-key
      - AI_DAILY_RABBITMQ_RESULT_EXCHANGE=wud.daily.ai.exchange
      - AI_DAILY_RABBITMQ_RESULT_ROUTING_KEY=wud.daily.ai.result.routing-key
    depends_on:
      - rabbitmq
    networks:
      - app-network
    restart: always

  certbot:
    image: certbot/certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - app-network
    restart: always

networks:
  app-network:
    driver: bridge

global:
  slack_api_url: 'https://hooks.slack.com/services/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'

route:
  receiver: 'slack'
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h

receivers:
  - name: 'slack'
    slack_configs:
      - send_resolved: true
        title: '[{{ .Status | toUpper }}{{ if eq .Status "firing" }}:fire:{{ else }}:white_check_mark:{{ end }}] {{ .CommonAnnotations.summary }}'
        text: |
          {{ range .Alerts }}
          *상태*: {{ .Status }}
          *요약*: {{ .Annotations.summary }}
          *내용*: {{ .Annotations.description }}
          *발생시각*: {{ .StartsAt.Format "2006-01-02 15:04:05" }}
          {{ end }}
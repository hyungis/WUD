spring:
  application:
    name: woojudraw
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: ${REDIS_TIMEOUT:2s}
      password: ${REDIS_PASSWORD:}

  profiles:
    active: local

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

security:
  jwt:
    secret: "${JWT_SECRET:local-dev-secret-change-this-to-32+chars}"
    access-token-exp-min: 30
    refresh-token-exp-day: 14

server:
  port: 8081

logging:
  level:
    org.hibernate.SQL: debug
